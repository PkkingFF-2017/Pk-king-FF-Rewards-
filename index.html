<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.K. KING REWARDS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffd700;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .balance-card {
            background: linear-gradient(45deg, #f39c12, #d35400);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.4);
        }
        .balance-card p {
            font-size: 14px;
            text-transform: uppercase;
        }
        .balance-card h2 {
            font-size: 32px;
            margin: 5px 0;
        }
        .rate-tag {
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 10px;
            display: inline-block;
        }
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .btn-action:hover {
            background: #ffd700;
            color: #000;
            transform: translateY(-2px);
        }
        .redeem-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 15px;
        }
        .redeem-section h3 {
            margin-bottom: 12px;
            color: #ffd700;
            font-size: 18px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            background: #27ae60;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background: #2ecc71;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #1e272e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 1px solid #ffd700;
        }
        .wheel-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ffd700;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: transform 2s ease-out;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>P.K. KING REWARDS</h1>
        <p style="font-size: 12px; opacity: 0.8;">Play & Win Daily Cash</p>
    </div>

    <div class="balance-card">
        <p>Total Balance</p>
        <h2><span id="coinBalance">0</span> 🪙</h2>
        <span class="rate-tag">15,000 Coins = ₹10</span>
    </div>

    <div class="grid-buttons">
        <div class="btn-action" onclick="dailyCheckIn()">📅 Daily Bonus</div>
        <div class="btn-action" onclick="openSpin()">🎡 Spin Wheel</div>
        <div class="btn-action" onclick="scratchCard()">🎰 Scratch Card</div>
        <div class="btn-action" onclick="showHistory()">📜 History</div>
    </div>

    <div class="redeem-section">
        <h3>🎁 Withdraw / Redeem</h3>
        <select id="redeemType">
            <option value="upi">Instant UPI Cash (₹10 = 15,000 Coins)</option>
            <option value="play">Google Play Code (₹10 = 15,000 Coins)</option>
        </select>
        <input type="text" id="userDetail" placeholder="Enter UPI ID or Mobile Number">
        <button class="btn-submit" onclick="processRedeem()">Request Payout</button>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal" id="gameModal">
    <div class="modal-content">
        <h3 id="modalTitle">Game</h3>
        <div id="modalBody"></div>
        <button class="btn-action" style="margin-top: 15px; width: 100%;" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    let coins = parseInt(localStorage.getItem('pk_coins')) || 0;
    document.getElementById('coinBalance').innerText = coins.toLocaleString();

    function updateCoins(amount) {
        coins += amount;
        localStorage.setItem('pk_coins', coins);
        document.getElementById('coinBalance').innerText = coins.toLocaleString();
    }

    function dailyCheckIn() {
        let lastCheck = localStorage.getItem('pk_last_check');
        let today = new Date().toDateString();
        if(lastCheck === today) {
            alert('Aapne aaj ka Daily Bonus pehle hi claim kar liya hai!');
        } else {
            localStorage.setItem('pk_last_check', today);
            updateCoins(500);
            alert('Congratulations! Aapko 500 Daily Coins mil gaye hain!');
        }
    }

    function openSpin() {
        document.getElementById('modalTitle').innerText = 'Spin Wheel';
        document.getElementById('modalBody').innerHTML = `
            <div class="wheel-box" id="wheel">SPIN</div>
            <button class="btn-submit" onclick="spinNow()">Spin Now</button>
        `;
        document.getElementById('gameModal').style.display = 'flex';
    }

    function spinNow() {
        let wheel = document.getElementById('wheel');
        let randomSpin = Math.floor(Math.random() * 360) + 720;
        wheel.style.transform = `rotate(${randomSpin}deg)`;
        setTimeout(() => {
            let winCoins = Math.floor(Math.random() * 300) + 100;
            updateCoins(winCoins);
            alert(`Aapne jeete ${winCoins} Coins!`);
            closeModal();
        }, 2000);
    }

    function scratchCard() {
        let winCoins = Math.floor(Math.random() * 400) + 100;
        updateCoins(winCoins);
        alert(`Scratch Successful! Aapko ${winCoins} Coins mile!`);
    }

    function processRedeem() {
        let detail = document.getElementById('userDetail').value;
        if(coins < 15000) {
            alert('Aapke paas kam se kam 15,000 Coins hone chahiye!');
            return;
        }
        if(!detail) {
            alert('Kripya apni UPI ID ya Details enter karein!');
            return;
        }
        coins -= 15000;
        localStorage.setItem('pk_coins', coins);
        document.getElementById('coinBalance').innerText = coins.toLocaleString();
        alert('Payout Request Submitted Successfully! 24 Hours me receive ho jayega.');
    }

    function closeModal() {
        document.getElementById('gameModal').style.display = 'none';
    }
</script>

</body>
</html>
