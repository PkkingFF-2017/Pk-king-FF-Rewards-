<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK KING REWARDS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <!-- React & Babel for Browser JS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [user, setUser] = useState(() => {
            const saved = localStorage.getItem('pk_user_profile');
            return saved ? JSON.parse(saved) : {
                id: 'PK_' + Math.floor(100000 + Math.random() * 900000),
                name: 'FF Warrior',
                email: 'asharphibharati@gmail.com',
                coins: 250,
                referralCode: 'PKKING99',
                dailyStreak: 1,
                spinsLeft: 5,
                scratchesLeft: 5,
                quizAttemptsLeft: 5
            };
        });

        useEffect(() => {
            localStorage.setItem('pk_user_profile', JSON.stringify(user));
        }, [user]);

        const addCoins = (amount, reason) => {
            setUser(prev => ({ ...prev, coins: prev.coins + amount }));
            if (window.confetti) {
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.85 } });
            }
        };

        const doSpin = () => {
            if (user.spinsLeft <= 0) return alert('Aaj ke spins khatam!');
            const win = Math.floor(Math.random() * 20) + 10;
            setUser(prev => ({ ...prev, spinsLeft: prev.spinsLeft - 1 }));
            addCoins(win, 'Lucky Spin');
            alert(`🎉 Spin Bonus: +${win} Coins!`);
        };

        const doScratch = () => {
            if (user.scratchesLeft <= 0) return alert('Aaj ke scratch cards khatam!');
            const win = Math.floor(Math.random() * 25) + 15;
            setUser(prev => ({ ...prev, scratchesLeft: prev.scratchesLeft - 1 }));
            addCoins(win, 'Scratch Card');
            alert(`🎰 Scratch Bonus: +${win} Coins!`);
        };

        const redeem = (title, cost) => {
            if (user.coins < cost) return alert('Sikke kam hain!');
            const target = prompt('Enter UPI ID / Mobile / Email:');
            if (target) {
                setUser(prev => ({ ...prev, coins: prev.coins - cost }));
                if (window.confetti) confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
                alert(`✅ ${title} Redeem Request Sent! 24-48 hours me process ho jayega.`);
            }
        };

        return (
            <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 pb-20 border-x border-slate-800">
                {/* Header */}
                <header className="p-4 bg-slate-800/80 backdrop-blur border-b border-slate-700 flex justify-between items-center sticky top-0 z-50">
                    <div className="font-bold text-amber-500 text-lg">P.K. KING REWARDS</div>
                    <div className="bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full text-amber-400 font-bold text-sm flex items-center gap-1">
                        🪙 {user.coins}
                    </div>
                </header>

                {/* Body Content */}
                <main className="p-4 space-y-4">
                    {/* Banner */}
                    <div className="bg-gradient-to-r from-amber-500 to-orange-500 p-4 rounded-xl text-slate-950 font-bold">
                        <div className="text-xs uppercase tracking-wider opacity-80">PK King FF Daily Loot</div>
                        <div className="text-2xl mt-1">Play Tasks, Earn Coins & Get Free Codes!</div>
                    </div>

                    {activeTab === 'home' && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={doSpin} className="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center hover:border-amber-500 transition">
                                    <div className="text-2xl mb-1">🎡</div>
                                    <div className="font-bold text-sm">Lucky Spin</div>
                                    <div className="text-xs text-slate-400">{user.spinsLeft} Spins Baaki</div>
                                </button>
                                <button onClick={doScratch} className="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center hover:border-amber-500 transition">
                                    <div className="text-2xl mb-1">🎰</div>
                                    <div className="font-bold text-sm">Scratch Card</div>
                                    <div className="text-xs text-slate-400">{user.scratchesLeft} Cards Baaki</div>
                                </button>
                            </div>

                            {/* YouTube Task */}
                            <div className="bg-slate-800 p-4 rounded-xl border border-red-500/30 flex justify-between items-center">
                                <div>
                                    <div className="font-bold text-sm text-red-400">YouTube Channel</div>
                                    <div className="text-xs text-slate-400">Subscribe for +50 Coins</div>
                                </div>
                                <button onClick={() => { window.open('https://youtube.com/@p.k.king.freefire'); addCoins(50, 'YT Bonus'); }} className="bg-red-500 hover:bg-red-600 text-white font-bold text-xs px-3 py-2 rounded-lg">
                                    Open
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'redeem' && (
                        <div className="space-y-3">
                            <div className="font-bold text-amber-500 text-sm">Redeem Store</div>
                            <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div>
                                    <div className="font-bold text-sm">Google Play Code ₹10</div>
                                    <div className="text-xs text-slate-400">15,000 Coins</div>
                                </div>
                                <button onClick={() => redeem('Google Play ₹10', 15000)} className="bg-amber-500 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg">Redeem</button>
                            </div>
                            <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div>
                                    <div className="font-bold text-sm">Instant UPI Cash ₹10</div>
                                    <div className="text-xs text-slate-400">15,000 Coins</div>
                                </div>
                                <button onClick={() => redeem('UPI Cash ₹10', 15000)} className="bg-amber-500 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg">Redeem</button>
                            </div>
                        </div>
                    )}
                </main>

                {/* Bottom Nav */}
                <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900/90 backdrop-blur border-t border-slate-800 flex justify-around py-3 text-xs">
                    <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center ${activeTab === 'home' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}>
                        <span>🏠</span> Home
                    </button>
                    <button onClick={() => setActiveTab('redeem')} className={`flex flex-col items-center ${activeTab === 'redeem' ? 'text-amber-500 font-bold' : 'text-slate-400'}`}>
                        <span>🎁</span> Redeem
                    </button>
                </nav>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
